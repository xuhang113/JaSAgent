spring.application.name=jasagent-sidecar
# 容器内必须监听所有网卡，agent 才能从旁边的网络命名空间连进来。端口与镜像约定一致。
server.address=0.0.0.0
server.port=8080
spring.main.banner-mode=off
# 错误页不回显异常、绑定错误或请求细节，避免把通行证或上游地址带出进程。
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
spring.mvc.log-request-details=false
server.tomcat.accesslog.enabled=false
# 不限制 POST 大小，也不把还没读完的正文先吞进内存。大模型请求按流进出。
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1
# 通行证服务根地址，不含 /v1/tickets。默认是本机已有的 agentpass，可用环境变量覆盖。不要把密钥写进本文件。
jasagent.sidecar.agentpass-base-url=${JASAGENT_AGENTPASS_BASE_URL:http://127.0.0.1:18741}
jasagent.sidecar.agentpass-timeout-millis=3000
# 大模型上游可能较慢。只限制等待时间，不记录请求体。
jasagent.sidecar.upstream-timeout-millis=60000
# 额外放行的主机，逗号或空白分隔。只认主机名，不认路径。未设置时只有内置的两家大模型主机。
jasagent.sidecar.llm-allowlist=${JASAGENT_LLM_ALLOWLIST:}
# 验收时才把 Tomcat 的操作系统平台工作线程压到这个数。0 表示不替换 Tomcat 自己的线程池，生产不要改低。
# 这不是 server.tomcat.threads.max。开启虚拟线程时后者往往只是请求槽位，压低它测不出“不占平台线程”。
jasagent.sidecar.tomcat-platform-workers=0
