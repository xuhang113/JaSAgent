# 两台 agent。容器端口 8080。网关按端口区分实例，所以两个 Service 分别是 18731 和 18732。
# 直接出网被网络策略拦住。外部请求走 jasagent-sidecar 的 /v1/forward，地址用集群 DNS。
# RuntimeClass 是 gvisor。
apiVersion: v1
kind: Service
metadata:
  name: jasagent-agent
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: agent
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: agent
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: jasagent-agent-0
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: agent
spec:
  selector:
    statefulset.kubernetes.io/pod-name: jasagent-agent-0
  ports:
    - name: http
      port: 18731
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: jasagent-agent-1
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: agent
spec:
  selector:
    statefulset.kubernetes.io/pod-name: jasagent-agent-1
  ports:
    - name: http
      port: 18732
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jasagent-agent
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: agent
spec:
  serviceName: jasagent-agent
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jasagent
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jasagent
        app.kubernetes.io/component: agent
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
      containers:
        - name: agent
          image: jasagent-agent:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JASAGENT_PORT
              value: "8080"
            - name: JASAGENT_CHECKPOINT
              value: mysql
            - name: JASAGENT_CHECKPOINT_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: jdbc-url
            - name: JASAGENT_CHECKPOINT_JDBC_USER
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: username
            - name: JASAGENT_CHECKPOINT_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: password
            - name: JASAGENT_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: jdbc-url
            - name: JASAGENT_JDBC_USER
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: username
            - name: JASAGENT_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: password
            - name: JASAGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jasagent-internal
                  key: token
            - name: XAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jasagent-llm
                  key: xai-api-key
            - name: JASAGENT_EGRESS_ENABLED
              value: "true"
            - name: JASAGENT_EGRESS_TICKET_URL
              value: http://jasagent-agentpass.jasagent.svc.cluster.local:18741/v1/tickets
            - name: JAVA_TOOL_OPTIONS
              value: -Duser.home=/var/lib/jasagent
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1280Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: home
              mountPath: /var/lib/jasagent
            - name: tmp
              mountPath: /tmp
            - name: mysql-password
              mountPath: /var/lib/jasagent/.config/urag-mysql-root.password
              subPath: urag-mysql-root.password
              readOnly: true
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: mysql-password
          secret:
            secretName: jasagent-mysql
            defaultMode: 0444
            items:
              - key: password
                path: urag-mysql-root.password
