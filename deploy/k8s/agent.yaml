# agent 运行时。容器端口 8080，向 Nacos 注册 Pod IP，由 HPA 按进行中的会话扩缩容。
# 副本不再钉死为不可扩缩的两台：HPA 最小 2、最大 10。主指标是 jasagent_sessions_active，CPU 只作补充。
# 不再提供把 jasagent-agent-0 / jasagent-agent-1 钉在 18731 / 18732 的 Service，网关只从 Nacos 发现实例。
# 每个 agent Pod 带一个 sidecar 容器，监听 0.0.0.0:18761（覆盖镜像默认的 8080，避免和 agent 抢端口）。
# agent 经本机回环 http://127.0.0.1:18761 访问 /v1/forward；离开集群的 HTTP 走 sidecar，集群内仍直连。
# sidecar 以 UID 10002 运行，便于同一网络命名空间内与 agent（UID 10001）区分出站。
# 直接出网由 agent 容器的 LD_PRELOAD 进程级过滤拦住；sidecar 不加载该库，可以代表它出站。
# 本机内核没有 xt_owner，gVisor 同 Pod 还共用 hostinet sandbox（插座在宿主机上显示为 UID 0），
# 不能再用按 Pod IP 或 sandbox cgroup 的兜底，否则会误伤 sidecar。RuntimeClass 是 gvisor。
# 聊天会话表 agent_session 和执行库走 JASAGENT_JDBC_*，检查点走 JASAGENT_CHECKPOINT_JDBC_*。
# 两者的地址都是 Secret jasagent-mysql 的 jdbc-url，账号是 username，口令是 password。地址里没有 password=。
# volume home 的 emptyDir 不是聊天会话的权威存储。会话在集群里已有的 MySQL。
apiVersion: v1
kind: Service
metadata:
  name: jasagent-agent
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: agent
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: agent
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jasagent-agent
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: agent
spec:
  serviceName: jasagent-agent
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jasagent
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jasagent
        app.kubernetes.io/component: agent
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
      containers:
        - name: agent
          image: jasagent-agent:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JASAGENT_PORT
              value: "8080"
            - name: JASAGENT_NACOS_SERVER_ADDR
              value: jasagent-nacos.jasagent.svc.cluster.local:8848
            - name: JASAGENT_ADVERTISE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: JASAGENT_CHECKPOINT
              value: mysql
            - name: JASAGENT_CHECKPOINT_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: jdbc-url
            - name: JASAGENT_CHECKPOINT_JDBC_USER
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: username
            - name: JASAGENT_CHECKPOINT_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: password
            # 聊天会话 agent_session 与执行库。与网关账号库同一条 jdbc-url，不是 Pod 里的 emptyDir。
            - name: JASAGENT_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: jdbc-url
            - name: JASAGENT_JDBC_USER
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: username
            - name: JASAGENT_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: password
            - name: JASAGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jasagent-internal
                  key: token
            - name: JASAGENT_SIDECAR_URL
              value: "http://127.0.0.1:18761"
            # 执行链路按 OTLP HTTP 报到集群内采集器，再转到 Jaeger。未配置则不外发。
            - name: JASAGENT_OTEL_ENDPOINT
              value: http://jasagent-otel-collector.jasagent.svc.cluster.local:4318/v1/traces
            - name: LD_PRELOAD
              value: /opt/jasagent/libjasagent-egress-filter.so
            - name: XAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jasagent-llm
                  key: xai-api-key
            - name: JASAGENT_EGRESS_ENABLED
              value: "true"
            - name: JASAGENT_EGRESS_TICKET_URL
              value: http://jasagent-agentpass.jasagent.svc.cluster.local:18741/v1/tickets
            - name: JAVA_TOOL_OPTIONS
              value: -Duser.home=/var/lib/jasagent
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1280Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: home
              mountPath: /var/lib/jasagent
            - name: tmp
              mountPath: /tmp
            - name: mysql-password
              mountPath: /var/lib/jasagent/.config/urag-mysql-root.password
              subPath: urag-mysql-root.password
              readOnly: true
            # 本机进程级出站过滤：只拦 agent 进程直连外网，不影响同 Pod sidecar。
            - name: egress-filter
              mountPath: /opt/jasagent/libjasagent-egress-filter.so
              readOnly: true
        # sidecar 与 agent 同 Pod、同网络命名空间，随 StatefulSet / HPA 一起扩缩。
        # 镜像入口默认 --server.port=8080，这里只在 Pod 里覆盖为 18761，不改镜像和 Java。
        # 探针对 Pod IP 访问 /health，所以必须绑 0.0.0.0 而不是只绑 127.0.0.1。
        - name: sidecar
          image: jasagent-sidecar:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /opt/java/bin/java
            - -XX:MaxRAMPercentage=60
            - -jar
            - /opt/jasagent/jasagent-sidecar.jar
            - --server.address=0.0.0.0
            - --server.port=18761
          ports:
            - name: sidecar
              containerPort: 18761
          env:
            - name: JASAGENT_AGENTPASS_BASE_URL
              value: http://jasagent-agentpass.jasagent.svc.cluster.local:18741
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                secretKeyRef:
                  name: jasagent-proxy
                  key: java-tool-options
                  optional: true
          startupProbe:
            httpGet:
              path: /health
              port: sidecar
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: sidecar
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10002
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: sidecar-home
              mountPath: /var/lib/jasagent
            - name: sidecar-tmp
              mountPath: /tmp
      volumes:
        # 其它家目录文件。聊天会话不写在这块 emptyDir 里。
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: mysql-password
          secret:
            secretName: jasagent-mysql
            defaultMode: 0444
            items:
              - key: password
                path: urag-mysql-root.password
        - name: sidecar-home
          emptyDir: {}
        - name: sidecar-tmp
          emptyDir: {}
        - name: egress-filter
          hostPath:
            path: /home/box/lib/libjasagent-egress-filter.so
            type: File
---
# HPA 管理副本。主指标是进行中的会话，CPU 只作补充，不能当作唯一依据。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jasagent-agent
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: jasagent-agent
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: jasagent_sessions_active
        target:
          type: AverageValue
          averageValue: "8"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
