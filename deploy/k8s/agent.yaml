# agent 运行时。容器端口 8080，向 Nacos 注册 Pod IP，由 HPA 按进行中的会话扩缩容。
# 副本不再钉死为不可扩缩的两台：HPA 最小 2、最大 10。主指标是 jasagent_sessions_active，CPU 只作补充。
# 不再提供把 jasagent-agent-0 / jasagent-agent-1 钉在 18731 / 18732 的 Service，网关只从 Nacos 发现实例。
# 直接出网被网络策略拦住。外部请求走 jasagent-sidecar 的 /v1/forward。RuntimeClass 是 gvisor。
apiVersion: v1
kind: Service
metadata:
  name: jasagent-agent
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: agent
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: agent
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jasagent-agent
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: agent
spec:
  serviceName: jasagent-agent
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jasagent
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jasagent
        app.kubernetes.io/component: agent
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
      containers:
        - name: agent
          image: jasagent-agent:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JASAGENT_PORT
              value: "8080"
            - name: JASAGENT_NACOS_SERVER_ADDR
              value: jasagent-nacos.jasagent.svc.cluster.local:8848
            - name: JASAGENT_ADVERTISE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: JASAGENT_CHECKPOINT
              value: mysql
            - name: JASAGENT_CHECKPOINT_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: jdbc-url
            - name: JASAGENT_CHECKPOINT_JDBC_USER
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: username
            - name: JASAGENT_CHECKPOINT_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: password
            - name: JASAGENT_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: jdbc-url
            - name: JASAGENT_JDBC_USER
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: username
            - name: JASAGENT_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: password
            - name: JASAGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jasagent-internal
                  key: token
            - name: XAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jasagent-llm
                  key: xai-api-key
            - name: JASAGENT_EGRESS_ENABLED
              value: "true"
            - name: JASAGENT_EGRESS_TICKET_URL
              value: http://jasagent-agentpass.jasagent.svc.cluster.local:18741/v1/tickets
            - name: JAVA_TOOL_OPTIONS
              value: -Duser.home=/var/lib/jasagent
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1280Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: home
              mountPath: /var/lib/jasagent
            - name: tmp
              mountPath: /tmp
            - name: mysql-password
              mountPath: /var/lib/jasagent/.config/urag-mysql-root.password
              subPath: urag-mysql-root.password
              readOnly: true
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: mysql-password
          secret:
            secretName: jasagent-mysql
            defaultMode: 0444
            items:
              - key: password
                path: urag-mysql-root.password
---
# HPA 管理副本。主指标是进行中的会话，CPU 只作补充，不能当作唯一依据。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jasagent-agent
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: jasagent-agent
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: jasagent_sessions_active
        target:
          type: AverageValue
          averageValue: "8"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
