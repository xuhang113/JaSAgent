# 把 agent 的进行中会话指标接到自定义指标 API，供 HPA 使用。CPU 仍走 metrics-server，只作补充。
# 业务容器使用 gVisor。Prometheus 里的指标名是 jasagent_sessions_active。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jasagent-metrics-adapter
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: metrics-adapter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jasagent-metrics-adapter
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: metrics-adapter
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["custom.metrics.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jasagent-metrics-adapter
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: metrics-adapter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jasagent-metrics-adapter
subjects:
  - kind: ServiceAccount
    name: jasagent-metrics-adapter
    namespace: jasagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jasagent-metrics-adapter-auth-delegator
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: metrics-adapter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: jasagent-metrics-adapter
    namespace: jasagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jasagent-metrics-adapter-auth-reader
  namespace: kube-system
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: metrics-adapter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: jasagent-metrics-adapter
    namespace: jasagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jasagent-metrics-adapter
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: metrics-adapter
data:
  config.yaml: |
    rules:
      - seriesQuery: 'jasagent_sessions_active'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "^jasagent_sessions_active$"
          as: "jasagent_sessions_active"
        metricsQuery: 'avg_over_time(jasagent_sessions_active{<<.LabelMatchers>>}[2m])'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jasagent-metrics-adapter
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: metrics-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jasagent
      app.kubernetes.io/component: metrics-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jasagent
        app.kubernetes.io/component: metrics-adapter
    spec:
      runtimeClassName: gvisor
      serviceAccountName: jasagent-metrics-adapter
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: adapter
          image: registry.k8s.io/prometheus-adapter/prometheus-adapter:v0.12.0
          imagePullPolicy: IfNotPresent
          args:
            - --secure-port=6443
            - --cert-dir=/tmp/cert
            - --prometheus-url=http://jasagent-prometheus.jasagent.svc.cluster.local:9090/
            - --metrics-relist-interval=30s
            - --config=/etc/adapter/config.yaml
          ports:
            - name: https
              containerPort: 6443
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /etc/adapter
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: jasagent-metrics-adapter
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jasagent-metrics-adapter
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: metrics-adapter
spec:
  selector:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: metrics-adapter
  ports:
    - name: https
      port: 6443
      targetPort: https
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.custom.metrics.k8s.io
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: metrics-adapter
spec:
  service:
    name: jasagent-metrics-adapter
    namespace: jasagent
    port: 6443
  group: custom.metrics.k8s.io
  version: v1beta1
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 100
  versionPriority: 100
