# agent 出站转发。镜像 jasagent-sidecar:0.1.0，容器端口 8080。
# 和 agent 都监听 8080，所以单独成 Pod。agent 用集群地址访问 /v1/forward。
# 免证主机是 api.deepseek.com、api.x.ai，以及 JASAGENT_LLM_ALLOWLIST。其它地址先问 agentpass。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jasagent-sidecar
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: sidecar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jasagent
      app.kubernetes.io/component: sidecar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jasagent
        app.kubernetes.io/component: sidecar
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      containers:
        - name: sidecar
          image: jasagent-sidecar:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JASAGENT_AGENTPASS_BASE_URL
              value: http://jasagent-agentpass.jasagent.svc.cluster.local:18741
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                secretKeyRef:
                  name: jasagent-proxy
                  key: java-tool-options
                  optional: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: jasagent-sidecar
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: sidecar
spec:
  selector:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: sidecar
  ports:
    - name: http
      port: 8080
      targetPort: http
