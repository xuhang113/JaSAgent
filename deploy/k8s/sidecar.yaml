# sidecar 不再作为独立的共享 Deployment（原先 replicas: 1）。
# 018 起 sidecar 容器放在每个 agent Pod 里，定义见 agent.yaml。
# 镜像仍是 jasagent-sidecar:0.1.0；构建用 sidecar-local.Dockerfile。
# 容器端口在 Pod 里覆盖为 18761，agent 经 127.0.0.1:18761 访问 /v1/forward。
# 本文件不再包含可 apply 的资源。一键脚本也不会再等待或重启 deployment/jasagent-sidecar。
# 从旧版本升级时，需要删掉遗留的 Deployment jasagent-sidecar 和 Service jasagent-sidecar。
