# 控制台上游。容器端口 18722。业务容器使用 gVisor。
# 只提供页面，供网关反向代理。登录接口仍在网关。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jasagent-web
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jasagent
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jasagent
        app.kubernetes.io/component: web
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
      containers:
        - name: web
          image: jasagent-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18722
          env:
            - name: JASAGENT_PORT
              value: "18722"
            - name: JAVA_TOOL_OPTIONS
              value: -Duser.home=/var/lib/jasagent
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /admin/login
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: home
              mountPath: /var/lib/jasagent
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jasagent-web
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 18722
      targetPort: http
