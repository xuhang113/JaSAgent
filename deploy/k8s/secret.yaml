# 这个文件不参与 kubectl apply。
# scripts/up-stack.sh 从本机已有文件读取后在集群里创建 Secret，清单里不写口令、令牌或模型密钥。
# jasagent-mysql: jdbc-url, username, password
#   jdbc-url 指向已有库 jasagent，地址里不能有 password=。
#   网关用它连接账号表、登录会话表、聊天会话表和粘性表。
#   agent 的 JASAGENT_JDBC_* 与检查点也用同一份 jdbc-url。
#   password 只放在本 Secret，由网关以文件挂载，由 agent 以环境变量引用。不写进 Git。
# jasagent-internal: token
# jasagent-llm: xai-api-key
# jasagent-agentpass: signing-key
#   生产环境必须提供，缺失则无法启动。只从仓库外文件写入集群 Secret，不写进 Git、日志或文档。
#   agentpass 的 JASAGENT_AGENTPASS_SIGNING_KEY 引用这个键。
#   agentpass 的 JASAGENT_JDBC_* 与 agent 一样，引用 jasagent-mysql 的 jdbc-url、username、password。
