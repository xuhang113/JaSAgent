# 通行证服务。容器端口 18741。业务容器使用 gVisor。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jasagent-agentpass
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: agentpass
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jasagent
      app.kubernetes.io/component: agentpass
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jasagent
        app.kubernetes.io/component: agentpass
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
      containers:
        - name: agentpass
          image: jasagent-agentpass:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18741
          env:
            - name: JASAGENT_PORT
              value: "18741"
            - name: JAVA_TOOL_OPTIONS
              value: -Duser.home=/var/lib/jasagent
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: home
              mountPath: /var/lib/jasagent
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jasagent-agentpass
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: agentpass
spec:
  selector:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: agentpass
  ports:
    - name: http
      port: 18741
      targetPort: http
