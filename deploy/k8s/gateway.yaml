# 网关对外端口 18721。业务容器使用 gVisor。
# 登录会话和存活探测都在网关进程内，本轮网关按单副本运行。
# 只从 Nacos 发现 agent 实例，不再使用静态目录或 jasagent-agent-0 / jasagent-agent-1。
# 控制台请求反代到 jasagent-web。粘性库通过可配置的 JDBC 地址直连集群 MySQL，口令仍只从仓库外的口令文件读取。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jasagent-gateway
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jasagent
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jasagent
        app.kubernetes.io/component: gateway
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
      containers:
        - name: gateway
          image: jasagent-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18721
          env:
            - name: JASAGENT_PORT
              value: "18721"
            - name: JASAGENT_NACOS_SERVER_ADDR
              value: jasagent-nacos.jasagent.svc.cluster.local:8848
            - name: JASAGENT_GATEWAY_WEB_ORIGIN
              value: http://jasagent-web.jasagent.svc.cluster.local:18722
            # 只信任 Ingress-nginx 这一跳的 X-Forwarded-*。取值由一键脚本按 Ingress Pod 或实际对端写入 ConfigMap，禁止 0.0.0.0/0 或 ::/0。
            - name: JASAGENT_GATEWAY_FORWARDED_TRUSTED
              valueFrom:
                configMapKeyRef:
                  name: jasagent-gateway-forwarded
                  key: trusted
                  optional: true
            - name: JASAGENT_GATEWAY_AFFINITY_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: jdbc-url
            - name: JASAGENT_GATEWAY_AFFINITY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: username
            - name: JASAGENT_GATEWAY_REPLICAS
              value: "1"
            - name: JASAGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jasagent-internal
                  key: token
            - name: JAVA_TOOL_OPTIONS
              value: -Duser.home=/var/lib/jasagent
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: home
              mountPath: /var/lib/jasagent
            - name: tmp
              mountPath: /tmp
            - name: mysql-password
              mountPath: /var/lib/jasagent/.config/urag-mysql-root.password
              subPath: urag-mysql-root.password
              readOnly: true
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: mysql-password
          secret:
            secretName: jasagent-mysql
            defaultMode: 0444
            items:
              - key: password
                path: urag-mysql-root.password
---
apiVersion: v1
kind: Service
metadata:
  name: jasagent-gateway
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: gateway
spec:
  selector:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 18721
      targetPort: http
