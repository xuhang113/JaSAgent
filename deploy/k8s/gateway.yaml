# 网关对外端口 18721。业务容器使用 gVisor。
# 登录会话、粘性和存活探测都写在集群已有的 MySQL 库 jasagent，本轮网关至少 2 个就绪副本。
# 只从 Nacos 发现 agent 实例，不再使用静态目录或 jasagent-agent-0 / jasagent-agent-1。
# 控制台请求反代到 jasagent-web。JASAGENT_GATEWAY_WEB_ORIGIN 保持集群内地址，不写成公网主机名。
# 账号表 jasagent_account、登录会话表 jasagent_login_session、聊天会话表 agent_session、
# 粘性表 jasagent_gateway_affinity 和存活表 jasagent_gateway_liveness 共用集群里已有的 MySQL。
# 020 的网关把这四张表都接到 jasagent.gateway.affinity.jdbc-url / username / password-file，
# 对应环境变量仍是 JASAGENT_GATEWAY_AFFINITY_JDBC_URL、JASAGENT_GATEWAY_AFFINITY_USERNAME
# 和 JASAGENT_GATEWAY_AFFINITY_PASSWORD_FILE。地址和账号来自 Secret jasagent-mysql 的
# jdbc-url、username。口令只从该 Secret 挂进的文件读取。JDBC 地址里不能有 password=。
# volume home 仍是 emptyDir，只放其它家目录文件（含一次性迁入运维账号时要读的目录）。
# 它不是账号或会话的权威存储。删掉或重启本 Pod 后，账号、聊天会话和存活探测状态仍在上述 MySQL 里。
# JASAGENT_GATEWAY_FORWARDED_TRUSTED 只信任 Ingress 这一跳，禁止 0.0.0.0/0 或 ::/0。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jasagent-gateway
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jasagent
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jasagent
        app.kubernetes.io/component: gateway
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
      containers:
        - name: gateway
          image: jasagent-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18721
          env:
            - name: JASAGENT_PORT
              value: "18721"
            - name: JASAGENT_NACOS_SERVER_ADDR
              value: jasagent-nacos.jasagent.svc.cluster.local:8848
            - name: JASAGENT_GATEWAY_WEB_ORIGIN
              value: http://jasagent-web.jasagent.svc.cluster.local:18722
            # 只反代到集群内 Jaeger 的 ClusterIP 根地址，不含路径。请求不能改写这个上游。
            - name: JASAGENT_GATEWAY_JAEGER_ORIGIN
              value: http://jasagent-jaeger.jasagent.svc.cluster.local:16686
            # 只信任 Ingress-nginx 这一跳的 X-Forwarded-*。取值由一键脚本按 Ingress Pod 或实际对端写入 ConfigMap，禁止 0.0.0.0/0 或 ::/0。
            - name: JASAGENT_GATEWAY_FORWARDED_TRUSTED
              valueFrom:
                configMapKeyRef:
                  name: jasagent-gateway-forwarded
                  key: trusted
                  optional: true
            # 账号、登录会话、聊天会话账本和粘性库共用这一条 JDBC。值来自 Secret，不能含 password=。
            - name: JASAGENT_GATEWAY_AFFINITY_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: jdbc-url
            - name: JASAGENT_GATEWAY_AFFINITY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jasagent-mysql
                  key: username
            # 与上面同一套库的口令文件。文件由下方 Secret 挂载，不把口令写进环境变量或 JDBC 地址。
            - name: JASAGENT_GATEWAY_AFFINITY_PASSWORD_FILE
              value: /var/lib/jasagent/.config/urag-mysql-root.password
            - name: JASAGENT_GATEWAY_REPLICAS
              value: "2"
            - name: JASAGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jasagent-internal
                  key: token
            - name: JAVA_TOOL_OPTIONS
              value: -Duser.home=/var/lib/jasagent
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          volumeMounts:
            # 家目录。账号和会话不写在这里，只给其它家目录文件和下面的口令文件挂载点使用。
            - name: home
              mountPath: /var/lib/jasagent
            - name: tmp
              mountPath: /tmp
            # 口令文件盖在家目录上。账号库、会话账本和粘性库都读这个路径。
            - name: mysql-password
              mountPath: /var/lib/jasagent/.config/urag-mysql-root.password
              subPath: urag-mysql-root.password
              readOnly: true
      volumes:
        # 不是账号或会话的权威存储。权威数据在集群 MySQL 的 jasagent 库。
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # Secret jasagent-mysql 的 password。清单里不写口令原文。
        - name: mysql-password
          secret:
            secretName: jasagent-mysql
            defaultMode: 0444
            items:
              - key: password
                path: urag-mysql-root.password
---
apiVersion: v1
kind: Service
metadata:
  name: jasagent-gateway
  namespace: jasagent
  labels:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: gateway
spec:
  selector:
    app.kubernetes.io/name: jasagent
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 18721
      targetPort: http
