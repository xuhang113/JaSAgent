server.address=127.0.0.1
server.port=18721
spring.main.web-application-type=servlet
jasagent.home=${user.home}
jasagent.gateway.tenant-id=local
jasagent.gateway.agents=127.0.0.1:18731,127.0.0.1:18732
jasagent.gateway.links.enabled=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.web.client.RestClient=INFO
spring.codec.log-request-details=false
