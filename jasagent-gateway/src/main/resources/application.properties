server.address=127.0.0.1
server.port=18721
spring.main.web-application-type=servlet
jasagent.home=${user.home}
jasagent.gateway.tenant-id=local
jasagent.gateway.agents=127.0.0.1:18731,127.0.0.1:18732
jasagent.gateway.links.enabled=true
# 浏览器控制台反代到这个 jasagent-web 根地址。上游不可用时返回错误，不回退内嵌页面。
jasagent.gateway.web-origin=http://127.0.0.1:18722
# 粘性库地址和账号。口令不写在这里，只从仓库外的口令文件读取。改了主机或库名就会连到那一处。
jasagent.gateway.affinity.jdbc-url=jdbc:mysql://127.0.0.1:3306/jasagent?connectTimeout=2000&socketTimeout=5000&allowPublicKeyRetrieval=true&useSSL=false&sslMode=DISABLED
jasagent.gateway.affinity.username=root
jasagent.gateway.affinity.password-file=${user.home}/.config/urag-mysql-root.password
# 登录会话和存活探测都在网关进程内，本轮网关按单副本验收。
jasagent.gateway.replicas=1
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.web.client.RestClient=INFO
spring.codec.log-request-details=false
