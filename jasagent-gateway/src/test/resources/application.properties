jasagent.gateway.links.enabled=false
jasagent.home=${java.io.tmpdir}/jasagent-gateway-test-home
jasagent.gateway.web-origin=http://127.0.0.1:18722
# 测试默认也不信任转发头。要模拟 Ingress 时由单个测试覆盖 jasagent.gateway.forwarded.trusted。
jasagent.gateway.forwarded.trusted=${JASAGENT_GATEWAY_FORWARDED_TRUSTED:}
server.forward-headers-strategy=none
server.tomcat.use-relative-redirects=true
jasagent.gateway.replicas=1
jasagent.gateway.affinity.jdbc-url=jdbc:mysql://127.0.0.1:3306/jasagent?connectTimeout=2000&socketTimeout=5000&allowPublicKeyRetrieval=true&useSSL=false&sslMode=DISABLED
jasagent.gateway.affinity.username=root
jasagent.gateway.affinity.password-file=${user.home}/.config/urag-mysql-root.password
logging.level.org.springframework.cloud.gateway=WARN
logging.level.org.springframework.web.client.RestClient=WARN
