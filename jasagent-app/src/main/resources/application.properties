server.address=127.0.0.1
# 本进程是本机 agent，默认 18731。另一台用 18732。网关占用 18721。这里不提供登录页和控制台。
server.port=18731
jasagent.home=${user.home}
jasagent.workspaces=
jasagent.scheduler.batch-size=4
jasagent.scheduler.merge-threshold=0.6
jasagent.scheduler.queue-cap=8
jasagent.rag.min-rerank=0.35
jasagent.deepseek.thinking=true
jasagent.evaluation.judge-enabled=false
jasagent.agentpass.enabled=true
jasagent.egress.enabled=true
jasagent.rag.base-url=http://127.0.0.1:18751
jasagent.egress.ticket-url=http://127.0.0.1:18741/v1/tickets
# 离开集群的 HTTP 交给本机回环上的 sidecar。这个地址不向 Nacos 注册。
jasagent.sidecar.url=${JASAGENT_SIDECAR_URL:http://127.0.0.1:18761}
jasagent.context.compress-at=0.85
# 空则不把执行链路导出到采集器。部署阶段再写成集群内 OTLP HTTP 地址，例如采集器的 /v1/traces。
jasagent.otel.endpoint=${JASAGENT_OTEL_ENDPOINT:}
jasagent.llm.timeout-seconds=60
# 0 表示不替换 Tomcat 线程池。验收才把 jasagent.app.tomcat-platform-workers 降到很小的操作系统平台线程数。
# 它不是 server.tomcat.threads.max；开启虚拟线程时后者往往只是请求槽位。生产默认不压低。
jasagent.app.tomcat-platform-workers=0
# Nacos 地址、账号和口令只从环境或仓库外文件读取，不把具体值写在这里。
# 注册地址用 JASAGENT_ADVERTISE_HOST。未设置时选择非回环网卡，不能注册 127.0.0.1。
# 进程若只绑在回环地址上，有 Nacos 配置时拒绝注册。本机入口会改绑 0.0.0.0。
jasagent.nacos.server-addr=${JASAGENT_NACOS_SERVER_ADDR:}
jasagent.nacos.username=${JASAGENT_NACOS_USERNAME:}
jasagent.nacos.password-file=${JASAGENT_NACOS_PASSWORD_FILE:}
jasagent.nacos.namespace=${JASAGENT_NACOS_NAMESPACE:}
jasagent.nacos.group=DEFAULT_GROUP
jasagent.nacos.service-name=jasagent-agent
jasagent.nacos.advertise-host=${JASAGENT_ADVERTISE_HOST:}
# 关掉客户端自带日志，避免把地址或口令打出来。
logging.level.com.alibaba.nacos=OFF
