server.address=127.0.0.1
# 本进程是本机 agent，默认 18731。另一台用 18732。网关占用 18721。这里不提供登录页和控制台。
server.port=18731
jasagent.home=${user.home}
jasagent.workspaces=
jasagent.scheduler.batch-size=4
jasagent.scheduler.merge-threshold=0.6
jasagent.scheduler.queue-cap=8
jasagent.rag.min-rerank=0.35
jasagent.deepseek.thinking=true
jasagent.evaluation.judge-enabled=false
jasagent.agentpass.enabled=true
jasagent.egress.enabled=true
jasagent.rag.base-url=http://127.0.0.1:18751
jasagent.egress.ticket-url=http://127.0.0.1:18741/v1/tickets
jasagent.context.compress-at=0.85
jasagent.llm.timeout-seconds=60
