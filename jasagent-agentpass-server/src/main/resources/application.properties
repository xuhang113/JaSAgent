server.address=127.0.0.1
server.port=18741
spring.application.name=jasagent-agentpass
spring.main.banner-mode=off
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
jasagent.home=${user.home}
jasagent.agentpass.ttl-seconds=120
# 签名密钥不写在这里。环境变量 JASAGENT_AGENTPASS_SIGNING_KEY 会绑定到 jasagent.agentpass.signing-key；留空则每次启动在内存里生成一把，不写日志。
